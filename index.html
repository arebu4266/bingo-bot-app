<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hager Bingo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #14101f;
    --panel: #1e1830;
    --accent: #7c3aed;
    --accent-2: #f59e0b;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --text: #f4f2fb;
    --muted: #9c93b5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px;
    padding-bottom: 90px;
  }
  h1 { font-size: 18px; text-align: center; margin: 4px 0 12px; color: var(--accent-2); letter-spacing: 1px; }

  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 70px; background: var(--panel); border-radius: 12px;
    padding: 8px 6px; text-align: center;
  }
  .stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .stat .value { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .stat.game .value { color: var(--green); }
  .stat.bet .value { color: var(--accent-2); }
  .stat.prize .value { color: var(--accent); }
  .stat.players .value { color: var(--blue); }

  .caller-panel {
    background: var(--panel); border-radius: 16px; padding: 14px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .called-count { font-size: 12px; color: var(--muted); text-align: center; }
  .called-count b { font-size: 18px; color: var(--text); display: block; }
  .ball {
    width: 76px; height: 76px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd88a, var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: #3a2400;
    box-shadow: 0 0 18px rgba(245,158,11,.6);
  }
  .recent { display: flex; gap: 6px; }
  .recent span {
    width: 30px; height: 30px; border-radius: 50%; background: #2a2340;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--muted);
  }

  .board {
    background: var(--panel); border-radius: 16px; padding: 10px;
  }
  .board-header, .board-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .board-header div {
    text-align: center; font-weight: 800; padding: 6px 0; border-radius: 8px; font-size: 13px;
  }
  .board-header div:nth-child(1) { background: #3b82f6; }
  .board-header div:nth-child(2) { background: #ef4444; }
  .board-header div:nth-child(3) { background: #f59e0b; color:#3a2400; }
  .board-header div:nth-child(4) { background: #22c55e; color:#0a2412; }
  .board-header div:nth-child(5) { background: #a855f7; }

  .cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: #2a2340; border-radius: 8px; font-weight: 700; font-size: 14px;
    color: var(--text);
  }
  .cell.free { background: var(--accent-2); color: #3a2400; }
  .cell.marked { background: var(--green); color: #06210f; }

  .status-msg { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0; min-height: 18px; }

  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    display: flex; gap: 10px;
  }
  button {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800;
    cursor: pointer;
  }
  #joinBtn { background: var(--accent); color: white; }
  #bingoBtn { background: var(--green); color: #06210f; }
  button:disabled { opacity: .4; }

  .winner-overlay {
    position: fixed; inset: 0; background: rgba(10,8,18,.92);
    display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center;
    padding: 24px; z-index: 10;
  }
  .winner-overlay.show { display: flex; }
  .winner-overlay .trophy { font-size: 48px; }
  .winner-overlay h2 { color: var(--accent-2); margin: 6px 0; }
  .winner-overlay p { color: var(--muted); }
</style>
</head>
<body>

<h1>🎱 HAGER BINGO</h1>

<div class="stat-row">
  <div class="stat game"><div class="label">Game</div><div class="value" id="gameId">--</div></div>
  <div class="stat bet"><div class="label">Bet</div><div class="value" id="bet">--</div></div>
  <div class="stat prize"><div class="label">Prize</div><div class="value" id="prize">--</div></div>
  <div class="stat players"><div class="label">Players</div><div class="value" id="players">--</div></div>
</div>

<div class="caller-panel">
  <div class="called-count">Called<br><b id="calledCount">0</b>/75</div>
  <div class="ball" id="ball">--</div>
  <div class="recent" id="recent"></div>
</div>

<div class="status-msg" id="statusMsg">Loading...</div>

<div class="board">
  <div class="board-header">
    <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
  </div>
  <div class="board-grid" id="boardGrid"></div>
</div>

<div class="bottom-bar">
  <button id="joinBtn">Buy Card</button>
  <button id="bingoBtn" disabled>BINGO!</button>
</div>

<div class="winner-overlay" id="winnerOverlay">
  <div class="trophy">🏆</div>
  <h2 id="winnerText">BINGO!</h2>
  <p id="winnerSub"></p>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const initData = tg?.initData || "";

let myCard = null;       // array of 25
let markedSet = new Set();
let currentGameId = null;

const $ = (id) => document.getElementById(id);

function renderBoard() {
  const grid = $("boardGrid");
  grid.innerHTML = "";
  if (!myCard) {
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = "?";
      grid.appendChild(cell);
    }
    return;
  }
  myCard.forEach((val, i) => {
    const cell = document.createElement("div");
    if (val === null) {
      cell.className = "cell free";
      cell.textContent = "★";
    } else {
      cell.className = "cell" + (markedSet.has(val) ? " marked" : "");
      cell.textContent = val;
    }
    grid.appendChild(cell);
  });
}

function checkLocalWin() {
  if (!myCard) return false;
  const g = [];
  for (let r = 0; r < 5; r++) g.push(myCard.slice(r * 5, r * 5 + 5));
  const isMarked = (v) => v === null || markedSet.has(v);
  for (const row of g) if (row.every(isMarked)) return true;
  for (let c = 0; c < 5; c++) if ([0,1,2,3,4].every(r => isMarked(g[r][c]))) return true;
  if ([0,1,2,3,4].every(i => isMarked(g[i][i]))) return true;
  if ([0,1,2,3,4].every(i => isMarked(g[i][4-i]))) return true;
  return false;
}

async function poll() {
  try {
    const res = await fetch("/api/state");
    const s = await res.json();

    $("gameId").textContent = "#" + s.game_id;
    $("bet").textContent = s.bet + " birr";
    $("prize").textContent = s.prize + " ETB";
    $("players").textContent = s.players;
    $("calledCount").textContent = s.called_count;
    $("ball").textContent = s.last_called ? `${s.last_called_letter}-${s.last_called}` : "--";
    $("recent").innerHTML = s.recent_called.map(n => `<span>${n}</span>`).join("");

    if (s.game_id !== currentGameId) {
      // new round started - reset local card unless we're already in the new one
      currentGameId = s.game_id;
      if (s.status === "waiting") {
        myCard = null;
        markedSet = new Set();
        $("winnerOverlay").classList.remove("show");
        $("joinBtn").disabled = false;
      }
    }

    markedSet = new Set(s.marked);
    renderBoard();

    if (s.status === "waiting") {
      $("statusMsg").textContent = s.starts_in != null
        ? `Game starts in ${s.starts_in}s - buy a card now!`
        : "Waiting for players to join...";
    } else if (s.status === "running") {
      $("statusMsg").textContent = "Game in progress...";
      $("joinBtn").disabled = true;
    } else if (s.status === "finished") {
      $("statusMsg").textContent = "Round finished.";
      if (s.winner) {
        $("winnerText").textContent = s.winner.user_id ? "BINGO!" : "No winner";
        $("winnerSub").textContent = `Prize: ${s.winner.prize} ETB`;
        $("winnerOverlay").classList.add("show");
      }
    }

    $("bingoBtn").disabled = !(myCard && s.status === "running" && checkLocalWin());
  } catch (e) {
    $("statusMsg").textContent = "Connection error, retrying...";
  }
}

$("joinBtn").addEventListener("click", async () => {
  $("joinBtn").disabled = true;
  try {
    const res = await fetch("/api/join", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ init_data: initData }),
    });
    const data = await res.json();
    if (!res.ok) {
      tg?.showAlert(data.detail || "Could not join");
      $("joinBtn").disabled = false;
      return;
    }
    myCard = data.card;
    currentGameId = data.game_id;
    renderBoard();
  } catch (e) {
    tg?.showAlert("Network error");
    $("joinBtn").disabled = false;
  }
});

$("bingoBtn").addEventListener("click", async () => {
  try {
    const res = await fetch("/api/bingo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ init_data: initData }),
    });
    const data = await res.json();
    if (!res.ok) {
      tg?.showAlert(data.detail || "Not a win");
      return;
    }
    $("winnerText").textContent = "YOU WON! 🎉";
    $("winnerSub").textContent = `Prize: ${data.prize} ETB`;
    $("winnerOverlay").classList.add("show");
  } catch (e) {
    tg?.showAlert("Network error");
  }
});

renderBoard();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
