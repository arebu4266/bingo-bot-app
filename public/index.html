<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 { color: #38bdf8; font-size: 20px; margin: 10px 0; }
        
        /* Top Stats Bar (Dil Bingo Style) */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .stat-box div:first-child { color: #94a3b8; font-size: 10px; }
        .stat-box div:last-child { font-weight: bold; color: #facc15; font-size: 14px; }

        /* Timer & Controls Bar */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .timer {
            background: #f59e0b;
            color: #000;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Called Number Display */
        .called-number-display {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .called-number {
            font-size: 40px;
            font-weight: bold;
            color: #facc15;
        }

        /* Grid for Cards / Numbers */
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            max-height: 45vh;
            overflow-y: auto;
            padding: 5px;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .cell {
            background: #334155;
            padding: 10px 2px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background: #475569; }
        .cell.active {
            background: #10b981;
            color: white;
        }
        .cell.reserved {
            background: #ea580c;
            color: white;
            cursor: not-allowed;
        }

        /* Buttons */
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn:active { background: #0369a1; }
    </style>
</head>
<body>

    <h1>DIL BINGO</h1>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-box">
            <div>MAIN WALLET</div>
            <div>0 ETB</div>
        </div>
        <div class="stat-box">
            <div>PLAY WALLET</div>
            <div>10 ETB</div>
        </div>
        <div class="stat-box">
            <div>STAKE</div>
            <div>10 ETB</div>
        </div>
    </div>

    <!-- Control & Timer -->
    <div class="control-bar">
        <button class="btn" style="width: auto; padding: 6px 12px;" onclick="toggleSound()" id="soundToggle">🔊 ድምጽ: በርቷል</button>
        <div class="timer" id="timerDisplay">18 s</div>
    </div>

    <!-- Called Number Box -->
    <div class="called-number-display">
        <div style="font-size: 12px; color: #94a3b8;">የተጠራው ቁጥር (Called Number)</div>
        <div class="called-number" id="currentNumber">-</div>
    </div>

    <!-- Card Selection Grid (1 to 75/104 Cards) -->
    <div class="grid" id="numberGrid"></div>

    <!-- Start / Bingo Action Button -->
    <button class="btn" onclick="startBingo()">🎮 ጨዋታ ጀምር (Start Bingo)</button>

    <script>
        let soundOn = true;
        let timerInterval = null;
        let calledNumbers = [];
        let selectedCartel = null;
        const totalCards = 75; // የካርዶች ብዛት

        const grid = document.getElementById('numberGrid');

        // Render Cards Grid
        for (let i = 1; i <= totalCards; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `card-${i}`;
            cell.innerText = i;
            
            // Randomly reserve some cards to look like Dil Bingo active rooms
            if (i % 3 === 0 && i % 2 === 0) {
                cell.classList.add('reserved');
            } else {
                cell.onclick = () => selectCard(i);
            }
            
            grid.appendChild(cell);
        }

        function selectCard(cardNum) {
            if (document.getElementById(`card-${cardNum}`).classList.contains('reserved')) return;
            
            // Reset previous selection
            if (selectedCartel && document.getElementById(`card-${selectedCartel}`)) {
                document.getElementById(`card-${selectedCartel}`).classList.remove('active');
            }
            
            selectedCartel = cardNum;
            document.getElementById(`card-${cardNum}`).classList.add('active');
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundToggle').innerText = soundOn ? "🔊 ድምጽ: በርቷል" : "🔇 ድምጽ: ጠፍቷል";
        }

        function speakNumber(num) {
            if (!soundOn) return;
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(num.toString());
                utterance.lang = 'am-ET';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startBingo() {
            if (!selectedCartel) {
                alert('እባክዎን መጀመሪያ የካርድ ቁጥር ይምረጡ!');
                return;
            }

            if (timerInterval) clearInterval(timerInterval);
            calledNumbers = [];
            
            let allNums = Array.from({length: 75}, (_, i) => i + 1);
            
            document.getElementById('timerDisplay').innerText = "InProgress";

            timerInterval = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(timerInterval);
                    alert('ጨዋታው አልቋል!');
                    return;
                }

                let remaining = allNums.filter(n => !calledNumbers.includes(n));
                let randomNum = remaining[Math.floor(Math.random() * remaining.length)];
                
                calledNumbers.push(randomNum);
                document.getElementById('currentNumber').innerText = randomNum;
                
                speakNumber(randomNum);
            }, 3000);
        }
    </script>
</body>
</html>
