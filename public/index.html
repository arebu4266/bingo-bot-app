<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        
        /* Header Info Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            align-items: center;
        }
        .top-bar div div:last-child { font-weight: bold; color: #facc15; }

        /* Main Game Layout (Side-by-Side when game starts) */
        .game-container {
            display: flex;
            gap: 10px;
            height: calc(100vh - 80px);
        }

        /* Left side: Called Numbers Board */
        .left-board {
            flex: 1.2;
            background: #1e293b;
            border-radius: 10px;
            padding: 8px;
            overflow-y: auto;
            max-height: 85vh;
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .board-cell {
            background: #334155;
            padding: 8px 2px;
            font-size: 11px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .board-cell.called {
            background: #10b981;
            color: white;
        }

        /* Right side: Cartel & Controls */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Selection Grid for 40s phase */
        .selection-grid-container {
            background: #1e293b;
            border-radius: 10px;
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 60vh;
        }
        .sel-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
        .sel-cell {
            background: #334155;
            padding: 8px 1px;
            font-size: 11px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }
        .sel-cell.active {
            background: #10b981;
            color: white;
        }

        /* Cartel Preview Box (Like in video) */
        .cartel-preview {
            background: #1e293b;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .cartel-table {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-top: 5px;
        }
        .cartel-cell {
            background: #334155;
            padding: 6px 2px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }
        .cartel-cell.marked {
            background: #10b981;
            color: white;
        }

        /* Buttons & Timer */
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .timer-box {
            background: #f59e0b;
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="topHeader">
        <div><div>GAME ID</div><div>DBEBR2Z6</div></div>
        <div><div>PLAYERS</div><div id="playerCount">372</div></div>
        <div><div>BET</div><div>10 ETB</div></div>
        <div><div>DERASH</div><div id="derashPool">2976</div></div>
        <div class="timer-box" id="timerDisplay">40 s</div>
    </div>

    <div id="selectionView">
        <div style="font-size: 13px; margin-bottom: 5px; color: #38bdf8;">ካርቴላ ይምረጡ (እስከ 3 ካርቴላ)</div>
        <div class="selection-grid-container">
            <div class="sel-grid" id="selectionGrid"></div>
        </div>
        
        <div class="cartel-preview" style="margin-top: 10px;">
            <div id="cartelTitle" style="font-size: 11px; color: #94a3b8;">ካርቴላ # -</div>
            <div class="cartel-table" id="previewTable"></div>
        </div>

        <button class="btn" style="margin-top: 10px;" onclick="confirmCards()">ካርቴላ 🔒 🔒 🔒</button>
    </div>

    <div id="gameView" class="game-container" style="display: none;">
        <div class="left-board">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: #38bdf8;">
                <span>የተጠራው ቁጥር: <b id="currentCalledNum" style="color: #facc15; font-size: 16px;">-</b></span>
                <span id="calledCount">Called: 0</span>
            </div>
            <div class="board-grid" id="mainBoardGrid"></div>
        </div>

        <div class="right-panel">
            <div style="background: #1e293b; padding: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                <span>AUTOMATIC</span>
                <input type="checkbox" id="autoToggle" checked style="transform: scale(1.2);">
            </div>

            <div class="cartel-preview" style="flex-grow: 1;">
                <div id="activeCartelTitle" style="font-size: 12px; color: #facc15; font-weight: bold;">CARTEL #39</div>
                <div class="cartel-table" id="activeCartelTable" style="margin-top: 10px;"></div>
            </div>

            <div id="spectatorNotice" style="font-size: 11px; color: #f59e0b; text-align: center;"></div>
        </div>
    </div>

    <script>
        let timeLeft = 40;
        let gameStarted = false;
        let selectedCartels = [];
        let playWallet = 30; // የሙከራ ባላንስ
        let calledNumbers = [];
        const totalCards = 104;

        // Populate Selection Grid
        const selGrid = document.getElementById('selectionGrid');
        for (let i = 1; i <= totalCards; i++) {
            let cell = document.createElement('div');
            cell.className = 'sel-cell';
            cell.id = `sel-${i}`;
            cell.innerText = i;
            cell.onclick = () => selectCard(i);
            selGrid.appendChild(cell);
        }

        function selectCard(num) {
            if (gameStarted) return;
            let idx = selectedCartels.indexOf(num);
            if (idx > -1) {
                selectedCartels.splice(idx, 1);
                document.getElementById(`sel-${num}`).classList.remove('active');
            } else {
                if (selectedCartels.length >= 3) {
                    alert('በአንድ ጨዋታ እስከ 3 ካርቴላ ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedCartels.push(num);
                document.getElementById(`sel-${num}`).classList.add('active');
            }
            updatePreview(num);
        }

        function updatePreview(num) {
            document.getElementById('cartelTitle').innerText = `CARTEL #${num}`;
            let previewTable = document.getElementById('previewTable');
            previewTable.innerHTML = '';
            // Sample preview numbers for the card
            for (let j = 0; j < 25; j++) {
                let cCell = document.createElement('div');
                cCell.className = 'cartel-cell';
                cCell.innerText = (num * 3 + j) % 75 + 1;
                previewTable.appendChild(cCell);
            }
        }

        // 40s Timer
        let timer = setInterval(() => {
            if (!gameStarted) {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + " s";
                if (timeLeft <= 0) {
                    startGame();
                }
            }
        }, 1000);

        function confirmCards() {
            if (selectedCartels.length === 0) {
                alert('እባክዎን ቢያንስ 1 ካርቴላ ይምረጡ!');
                return;
            }
            let totalCost = selectedCartels.length * 10;
            if (playWallet < totalCost) {
                alert(`❌ በቂ ባላንስ የለዎትም (Insufficient Balance)!\nያስፈለገው: ${totalCost} ብር\nያሎት: ${playWallet} ብር`);
                return;
            }
            playWallet -= totalCost;
            startGame();
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            clearInterval(timer);

            document.getElementById('selectionView').style.display = 'none';
            document.getElementById('gameView').style.display = 'flex';
            document.getElementById('timerDisplay').innerText = "InProgress";

            if (selectedCartels.length === 0) {
                document.getElementById('spectatorNotice').innerText = "👀 (እንደ ተመልካች ብቻ ተሳትፈዋል)";
                selectedCartels = [39]; // Default sample cartel for spectator view
            }

            // Build Main Board (1 to 75)
            let mainBoard = document.getElementById('mainBoardGrid');
            for (let i = 1; i <= 75; i++) {
                let bCell = document.createElement('div');
                bCell.className = 'board-cell';
                bCell.id = `b-cell-${i}`;
                bCell.innerText = i;
                mainBoard.appendChild(bCell);
            }

            // Build Active Cartel Table
            let activeCartelTable = document.getElementById('activeCartelTable');
            let sampleCartelNums = [];
            for (let j = 0; j < 25; j++) {
                let val = (selectedCartels[0] * 2 + j * 3) % 75 + 1;
                sampleCartelNums.push(val);
                let acCell = document.createElement('div');
                acCell.className = 'cartel-cell';
                acCell.id = `cartel-item-${val}`;
                acCell.innerText = val;
                activeCartelTable.appendChild(acCell);
            }

            // Game calling numbers loop
            let allNums = Array.from({length: 75}, (_, i) => i + 1);
            let gameLoop = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(gameLoop);
                    return;
                }
                let remaining = allNums.filter(n => !calledNumbers.includes(n));
                let drawn = remaining[Math.floor(Math.random() * remaining.length)];
                calledNumbers.push(drawn);

                document.getElementById('currentCalledNum').innerText = drawn;
                document.getElementById('calledCount').innerText = `Called: ${calledNumbers.length}`;

                if (document.getElementById(`b-cell-${drawn}`)) {
                    document.getElementById(`b-cell-${drawn}`).classList.add('called');
                }
                if (document.getElementById(`cartel-item-${drawn}`)) {
                    document.getElementById(`cartel-item-${drawn}`).classList.add('marked');
                }
            }, 3000);
        }
    </script>
</body>
</html>
