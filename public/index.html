<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 { color: #38bdf8; font-size: 20px; margin: 10px 0; }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .stat-box div:first-child { color: #94a3b8; font-size: 10px; }
        .stat-box div:last-child { font-weight: bold; color: #facc15; font-size: 14px; }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .timer {
            background: #f59e0b;
            color: #000;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        .called-number-display {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .called-number {
            font-size: 40px;
            font-weight: bold;
            color: #facc15;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            max-height: 45vh;
            overflow-y: auto;
            padding: 5px;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .cell {
            background: #334155;
            padding: 10px 2px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background: #475569; }
        .cell.active {
            background: #10b981;
            color: white;
        }
        .cell.reserved {
            background: #ea580c;
            color: white;
            cursor: not-allowed;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn:active { background: #0369a1; }
    </style>
</head>
<body>

    <h1>DIL BINGO</h1>

    <div class="stats-bar">
        <div class="stat-box">
            <div>MAIN WALLET</div>
            <div>0 ETB</div>
        </div>
        <div class="stat-box">
            <div>PLAY WALLET</div>
            <div id="playWallet">10</div>
        </div>
        <div class="stat-box">
            <div>STAKE / CARTEL</div>
            <div>10 ETB</div>
        </div>
    </div>

    <div class="control-bar">
        <button class="btn" style="width: auto; padding: 6px 12px;" onclick="toggleSound()" id="soundToggle">🔊 ድምጽ: በርቷል</button>
        <div class="timer" id="timerDisplay">40 s</div>
    </div>

    <div class="called-number-display">
        <div style="font-size: 12px; color: #94a3b8;" id="statusText">የካርቴላ መምረጫ ሰዓት</div>
        <div class="called-number" id="currentNumber">-</div>
    </div>

    <div class="grid" id="numberGrid"></div>

    <button class="btn" id="actionBtn" onclick="confirmCards()">🎮 ካርቴላዎችን 🔒 🔒 (እስከ 3)</button>

    <script>
        let soundOn = true;
        let timeLeft = 40;
        let gameStarted = false;
        let selectedCartels = [];
        let playWallet = 10; // የተጫዋች ባላንስ (በናሙና 10 ብር)
        let calledNumbers = [];
        const totalCards = 75;
        const cardPrice = 10;

        const grid = document.getElementById('numberGrid');

        for (let i = 1; i <= totalCards; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `card-${i}`;
            cell.innerText = i;
            cell.onclick = () => selectCard(i);
            grid.appendChild(cell);
        }

        function selectCard(cardNum) {
            if (gameStarted) {
                alert('ጨዋታው ስለጀመረ አዲስ ካርቴላ መምረጥ አይችሉም! (እንደ ተመልካች ይመለከታሉ)');
                return;
            }

            let index = selectedCartels.indexOf(cardNum);
            if (index > -1) {
                selectedCartels.splice(index, 1);
                document.getElementById(`card-${cardNum}`).classList.remove('active');
            } else {
                if (selectedCartels.length >= 3) {
                    alert('በአንድ ጨዋታ እስከ 3 ካርቴላ ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedCartels.push(cardNum);
                document.getElementById(`card-${cardNum}`).classList.add('active');
            }
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundToggle').innerText = soundOn ? "🔊 ድምጽ: በርቷል" : "🔇 ድምጽ: ጠፍቷል";
        }

        function speakNumber(num) {
            if (!soundOn) return;
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(num.toString());
                utterance.lang = 'am-ET';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 40 Seconds Timer Loop
        let countdown = setInterval(() => {
            if (!gameStarted) {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + " s";

                if (timeLeft <= 0) {
                    startTheGame();
                }
            }
        }, 1000);

        function confirmCards() {
            if (gameStarted) return;
            if (selectedCartels.length === 0) {
                alert('እባክዎን ቢያንስ 1 ካርቴላ ይምረጡ!');
                return;
            }

            let totalCost = selectedCartels.length * cardPrice;
            if (playWallet < totalCost) {
                alert(`❌ በቂ ባላንስ የለዎትም (Insufficient Balance)!\n\nያስፈለገው: ${totalCost} ብር\nያሎት: ${playWallet} ብር\n\nእባክዎን መጀመሪያ ቴሌብር ዲፖዚት ያድርጉ!`);
                return;
            }

            playWallet -= totalCost;
            document.getElementById('playWallet').innerText = playWallet;
            
            // 2 ብር ለቤት ኮሚሽን ተቆርጦ ቀሪው 8 ብር ለአሸናፊው የሚሰላበት ሎጂክ እዚህ ላይ ይያዛል
            alert(`✅ ${selectedCartels.length} ካርቴላ በደህና ተይዟል! ጨዋታው ሊጀምር ነው።`);
            startTheGame();
        }

        function startTheGame() {
            if (gameStarted) return;
            gameStarted = true;
            clearInterval(countdown);
            
            document.getElementById('timerDisplay').innerText = "InProgress";
            document.getElementById('statusText').innerText = "የተጠራው ቁጥር (Called Number)";
            document.getElementById('actionBtn').innerText = "🎮 ጨዋታው በመካሄድ ላይ ነው...";
            document.getElementById('actionBtn').style.background = "#64748b";

            let allNums = Array.from({length: 75}, (_, i) => i + 1);

            let gameLoop = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(gameLoop);
                    document.getElementById('statusText').innerText = "ጨዋታው አልቋል (Game Over)!";
                    return;
                }

                let remaining = allNums.filter(n => !calledNumbers.includes(n));
                let randomNum = remaining[Math.floor(Math.random() * remaining.length)];
                
                calledNumbers.push(randomNum);
                document.getElementById('currentNumber').innerText = randomNum;
                
                speakNumber(randomNum);
            }, 3000);
        }
    </script>
</body>
</html>
