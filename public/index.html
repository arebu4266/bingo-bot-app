<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 11px;
            align-items: center;
        }
        .top-bar div div:last-child { font-weight: bold; color: #facc15; }

        .game-container {
            display: flex;
            gap: 8px;
            height: calc(100vh - 75px);
        }

        /* Left Vertical B-I-N-G-O Board (Strictly Downwards) */
        .left-board {
            flex: 1.4;
            background: #1e293b;
            border-radius: 8px;
            padding: 6px;
            overflow-y: auto;
            max-height: 85vh;
        }
        .bingo-board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            text-align: center;
        }
        .bingo-col-header {
            background: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 4px 0;
            border-radius: 3px;
        }
        .board-num-cell {
            background: #334155;
            font-size: 11px;
            padding: 7px 1px;
            text-align: center;
            border-radius: 3px;
            font-weight: bold;
        }
        .board-num-cell.called {
            background: #10b981;
            color: white;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selection-grid-container {
            background: #1e293b;
            border-radius: 8px;
            padding: 8px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 52vh;
        }
        .sel-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
        .sel-cell {
            background: #334155;
            padding: 7px 1px;
            font-size: 11px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }
        .sel-cell.active {
            background: #10b981;
            color: white;
        }

        .cartel-preview {
            background: #1e293b;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }
        
        .bingo-table {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-top: 4px;
        }
        .bingo-header {
            background: #0284c7;
            color: white;
            font-size: 10px;
            padding: 3px 0;
            font-weight: bold;
            border-radius: 2px;
        }
        .bingo-cell {
            background: #334155;
            padding: 5px 2px;
            font-size: 10px;
            border-radius: 2px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bingo-cell.marked {
            background: #10b981;
            color: white;
        }
        .bingo-cell.free {
            background: #f59e0b;
            color: #000;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .timer-box {
            background: #f59e0b;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        /* Winner Modal Popup */
        #winnerModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #facc15;
            max-width: 320px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div><div>PLAYERS</div><div id="playerCount">0</div></div>
        <div><div>BET</div><div>10 ETB</div></div>
        <div><div>DERASH</div><div id="derashPool">0 ETB</div></div>
        <div class="timer-box" id="timerDisplay">40 s</div>
    </div>

    <div id="selectionView">
        <div style="font-size: 11px; margin-bottom: 4px; color: #38bdf8;">ካርቴላ ይምረጡ (ከ 1 እስከ 400 - እስከ 3)</div>
        <div class="selection-grid-container">
            <div class="sel-grid" id="selectionGrid"></div>
        </div>
        
        <div class="cartel-preview" style="margin-top: 6px;">
            <div id="cartelTitle" style="font-size: 10px; color: #94a3b8;">ካርቴላ # -</div>
            <div class="bingo-table" id="previewTable"></div>
        </div>

        <button class="btn" style="margin-top: 6px;" onclick="confirmCards()">ካርቴላ 🔒 (10 ብር)</button>
    </div>

    <div id="gameView" class="game-container" style="display: none;">
        <div class="left-board">
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 11px; color: #38bdf8;">
                <span>የተጠራው: <b id="currentCalledNum" style="color: #facc15; font-size: 14px;">-</b></span>
                <span id="calledCount">0/75</span>
            </div>
            
            <div class="bingo-board-grid" id="bingoBoardGrid"></div>
        </div>

        <div class="right-panel">
            <div class="cartel-preview" style="flex-grow: 1;">
                <div id="activeCartelTitle" style="font-size: 11px; color: #facc15; font-weight: bold;">CARTEL #</div>
                <div class="bingo-table" id="activeCartelTable" style="margin-top: 4px;"></div>
            </div>

            <button class="btn" style="background: #10b981;" onclick="checkManualBingo()">🎉 BINGO!</button>
            <div id="spectatorNotice" style="font-size: 11px; color: #f59e0b; text-align: center;"></div>
        </div>
    </div>

    <div id="winnerModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #facc15; margin-top: 0;">🏆 BINGO WINNER!</h2>
            <p id="winnerMessage" style="font-size: 13px; line-height: 1.5;"></p>
            <button class="btn" onclick="resetNewGame()" style="background: #10b981; margin-top: 10px;">ቀጣይ ጨዋታ ጀምር</button>
        </div>
    </div>

    <script>
        // Synchronized Master Seed and Timer via localStorage
        let serverStartTime = localStorage.getItem('bingo_start_time');
        const gameDuration = 40; // 40 seconds selection phase
        const callInterval = 3;  // Every 3 seconds a number is called
        
        if (!serverStartTime || Date.now() - parseInt(serverStartTime) > (45 + 75 * callInterval) * 1000) {
            serverStartTime = Date.now().toString();
            localStorage.setItem('bingo_start_time', serverStartTime);
            localStorage.setItem('bingo_players', '0');
        }

        let selectedCartels = [];
        let playersCount = parseInt(localStorage.getItem('bingo_players') || '0');
        let playWallet = 30; 
        let gameStarted = false;
        const totalCards = 400;

        document.getElementById('playerCount').innerText = playersCount;
        document.getElementById('derashPool').innerText = (playersCount * 8) + " ETB";

        // Build Selection Grid
        const selGrid = document.getElementById('selectionGrid');
        for (let i = 1; i <= totalCards; i++) {
            let cell = document.createElement('div');
            cell.className = 'sel-cell';
            cell.id = `sel-${i}`;
            cell.innerText = i;
            cell.onclick = () => selectCard(i);
            selGrid.appendChild(cell);
        }

        function generateBingoCard(seed) {
            let card = { B: [], I: [], N: [], G: [], O: [] };
            let rand = (min, max) => Math.floor(Math.abs(Math.sin(seed++) * 10000)) % (max - min + 1) + min;
            let getUniqueCols = (min, max, count) => {
                let nums = [];
                while(nums.length < count) {
                    let n = rand(min, max);
                    if(!nums.includes(n)) nums.push(n);
                }
                return nums.sort((a,b)=>a-b);
            };
            card.B = getUniqueCols(1, 15, 5);
            card.I = getUniqueCols(16, 30, 5);
            card.N = getUniqueCols(31, 45, 4);
            card.N.splice(2, 0, 'FREE');
            card.G = getUniqueCols(46, 60, 5);
            card.O = getUniqueCols(61, 75, 5);
            return card;
        }

        // Generate Master Synchronized Shuffled Sequence (1 to 75) based on start time
        function getMasterCalledNumbers(elapsedSeconds) {
            let startTimestamp = parseInt(serverStartTime);
            // Seeded shuffle for 1-75 numbers
            let nums = Array.from({length: 75}, (_, i) => i + 1);
            let seed = startTimestamp;
            for (let i = nums.length - 1; i > 0; i--) {
                seed = (seed * 9301 + 49297) % 233280;
                let j = Math.floor((seed / 233280) * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            
            let activeCallsCount = Math.max(0, Math.floor((elapsedSeconds - gameDuration) / callInterval));
            return nums.slice(0, Math.min(75, activeCallsCount));
        }

        function selectCard(num) {
            if (gameStarted) return;
            let idx = selectedCartels.indexOf(num);
            if (idx > -1) {
                selectedCartels.splice(idx, 1);
                document.getElementById(`sel-${num}`).classList.remove('active');
            } else {
                if (selectedCartels.length >= 3) {
                    alert('በአንድ ጨዋታ እስከ 3 ካርቴላ ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedCartels.push(num);
                document.getElementById(`sel-${num}`).classList.add('active');
            }
            updatePreview(num);
        }

        function updatePreview(num) {
            document.getElementById('cartelTitle').innerText = `ካርቴላ #${num}`;
            let previewTable = document.getElementById('previewTable');
            previewTable.innerHTML = '';
            ['B','I','N','G','O'].forEach(h => {
                let th = document.createElement('div');
                th.className = 'bingo-header';
                th.innerText = h;
                previewTable.appendChild(th);
            });
            let cardData = generateBingoCard(num);
            for (let row = 0; row < 5; row++) {
                ['B','I','N','G','O'].forEach(col => {
                    let cCell = document.createElement('div');
                    let val = cardData[col][row];
                    cCell.className = val === 'FREE' ? 'bingo-cell free' : 'bingo-cell';
                    cCell.innerText = val;
                    previewTable.appendChild(cCell);
                });
            }
        }

        // Global Synchronized Clock Loop
        let mainTimer = setInterval(() => {
            let elapsed = Math.floor((Date.now() - parseInt(serverStartTime)) / 1000);
            let timeLeft = gameDuration - elapsed;

            if (timeLeft > 0) {
                if (!gameStarted) {
                    document.getElementById('timerDisplay').innerText = timeLeft + " s";
                }
            } else {
                if (!gameStarted) {
                    startGame();
                } else {
                    updateActiveGame(elapsed);
                }
            }
        }, 1000);

        function confirmCards() {
            if (gameStarted) return;
            
            let totalCost = selectedCartels.length * 10;
            if (totalCost > 0 && playWallet < totalCost) {
                alert(`❌ በቂ ባላንስ የለዎትም (Insufficient Balance)!\nያስፈለገው: ${totalCost} ብር\nያሎት: ${playWallet} ብር`);
                return;
            }

            if (totalCost > 0) {
                playWallet -= totalCost;
                playersCount += selectedCartels.length;
                localStorage.setItem('bingo_players', playersCount);
            }

            startGame();
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;

            document.getElementById('selectionView').style.display = 'none';
            document.getElementById('gameView').style.display = 'flex';
            document.getElementById('timerDisplay').innerText = "InProgress";

            let totalDerash = playersCount * 8;
            document.getElementById('derashPool').innerText = totalDerash + " ETB";
            document.getElementById('playerCount').innerText = playersCount;

            if (selectedCartels.length === 0) {
                document.getElementById('spectatorNotice').innerText = "👀 (እንደ ተመልካች ብቻ ተሳትፈዋል)";
                selectedCartels = [1]; 
            }

            // Build Vertical B-I-N-G-O Left Board Grid (Strictly Downwards)
            let boardGrid = document.getElementById('bingoBoardGrid');
            const columns = {
                'B': [1, 15],
                'I': [16, 30],
                'N': [31, 45],
                'G': [46, 60],
                'O': [61, 75]
            };

            for (let letter of ['B', 'I', 'N', 'G', 'O']) {
                let hDiv = document.createElement('div');
                hDiv.className = 'bingo-col-header';
                hDiv.innerText = letter;
                boardGrid.appendChild(hDiv);
            }

            for (let r = 0; r < 15; r++) {
                for (let letter of ['B', 'I', 'N', 'G', 'O']) {
                    let num = columns[letter][0] + r;
                    let cell = document.createElement('div');
                    cell.className = 'board-num-cell';
                    cell.id = `b-cell-${num}`;
                    cell.innerText = num;
                    boardGrid.appendChild(cell);
                }
            }

            // Build Active Cartel Table
            let activeTable = document.getElementById('activeCartelTable');
            document.getElementById('activeCartelTitle').innerText = `CARTEL #${selectedCartels[0]}`;
            
            ['B','I','N','G','O'].forEach(h => {
                let th = document.createElement('div');
                th.className = 'bingo-header';
                th.innerText = h;
                activeTable.appendChild(th);
            });

            let activeCard = generateBingoCard(selectedCartels[0]);
            for (let row = 0; row < 5; row++) {
                ['B','I','N','G','O'].forEach(col => {
                    let val = activeCard[col][row];
                    let acCell = document.createElement('div');
                    acCell.className = val === 'FREE' ? 'bingo-cell free marked' : 'bingo-cell';
                    if(val !== 'FREE') {
                        acCell.id = `active-num-${val}`;
                    }
                    acCell.innerText = val;
                    activeTable.appendChild(acCell);
                });
            }

            let elapsed = Math.floor((Date.now() - parseInt(serverStartTime)) / 1000);
            updateActiveGame(elapsed);
        }

        // Render called numbers accurately on any device based on shared timeline
        function updateActiveGame(elapsed) {
            let calledNumbers = getMasterCalledNumbers(elapsed);
            if (calledNumbers.length > 0) {
                let latestNum = calledNumbers[calledNumbers.length - 1];
                document.getElementById('currentCalledNum').innerText = latestNum;
                document.getElementById('calledCount').innerText = `${calledNumbers.length}/75`;

                // Highlight called numbers on board and active card
                calledNumbers.forEach(n => {
                    let bCell = document.getElementById(`b-cell-${n}`);
                    if (bCell) bCell.classList.add('called');

                    let activeCell = document.getElementById(`active-num-${n}`);
                    if (activeCell) activeCell.classList.add('marked');
                });

                // Check win condition automatically on sync
                let activeCard = generateBingoCard(selectedCartels[0]);
                let cardNumbersList = [];
                for (let row = 0; row < 5; row++) {
                    ['B','I','N','G','O'].forEach(col => {
                        let val = activeCard[col][row];
                        if(val !== 'FREE') cardNumbersList.push(val);
                    });
                }

                let cardWon = cardNumbersList.every(n => calledNumbers.includes(n));
                let totalDerash = playersCount * 8;
                if (cardWon) {
                    triggerAutoWin(selectedCartels[0], totalDerash);
                }
            }
        }

        let disqualified = false;
        function checkManualBingo() {
            if (disqualified) {
                alert('❌ ካርቴላዎ ቀደም ሲል ስለታሰረ (Disqualified) መጫወት አይችሉም!');
                return;
            }

            let elapsed = Math.floor((Date.now() - parseInt(serverStartTime)) / 1000);
            let calledNumbers = getMasterCalledNumbers(elapsed);

            let activeCard = generateBingoCard(selectedCartels[0]);
            let cardNumbersList = [];
            for (let row = 0; row < 5; row++) {
                ['B','I','N','G','O'].forEach(col => {
                    let val = activeCard[col][row];
                    if(val !== 'FREE') cardNumbersList.push(val);
                });
            }

            let cardWon = cardNumbersList.every(n => calledNumbers.includes(n));
            let totalDerash = playersCount * 8;

            if (cardWon) {
                triggerAutoWin(selectedCartels[0], totalDerash);
            } else {
                disqualified = true;
                alert('⚠️ የተሳሳተ BINGO (False Bingo)! ካርቴላዎ ታስሯል (Disqualified)። ጨዋታው ግን ይቀጥላል!');
            }
        }

        function triggerAutoWin(cartelNum, totalDerash) {
            document.getElementById('winnerMessage').innerHTML = `🎉 <b>ኮንግራ! (Congra)</b><br><br>ካርቴላ ቁጥር <b>#${cartelNum}</b> ጨዋታውን በድል ዘግቷል!<br><br>💰 ያሸነፉት ደራሽ: <b>${totalDerash} ብር</b>`;
            document.getElementById('winnerModal').style.display = 'flex';
        }

        function resetNewGame() {
            localStorage.removeItem('bingo_start_time');
            localStorage.removeItem('bingo_players');
            location.reload();
        }
    </script>
</body>
</html>
