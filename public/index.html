<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hager Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        h1 { color: #38bdf8; font-size: 24px; margin: 10px 0; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:active { background: #0369a1; }
        .sound-btn { background: #334155; }
        .called-number-display {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .called-number {
            font-size: 40px;
            font-weight: bold;
            color: #facc15;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 5px;
            background: #1e293b;
            border-radius: 10px;
        }
        .cell {
            background: #334155;
            padding: 8px 2px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: bold;
        }
        .cell.active {
            background: #22c55e;
            color: white;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>ሁኔታ: <span id="status" style="color: #facc15;">ይጀምሩ</span></div>
        <button class="btn sound-btn" id="soundToggle" onclick="toggleSound()">🔊 ድምፅ: በርቷል</button>
    </div>

    <h1>🎯 Hager 200 Boards Bingo</h1>

    <div class="called-number-display">
        <div>የተጠራው ቁጥር</div>
        <div class="called-number" id="currentNumber">-</div>
    </div>

    <button class="btn" onclick="startBingo()" style="width: 100%; margin-bottom: 15px;">🎮 ጨዋታ ጀምር</button>

    <div style="font-size: 13px; margin-bottom: 5px; color: #94a3b8;">የሚገኙ 200 የቢንጎ ቦርዶች (Boards)</div>
    <!-- 200 ቦርዶች ማሳያ ግሪድ -->
    <div class="grid" id="numberGrid"></div>

    <script>
        let soundOn = true;
        let timer = null;
        let calledNumbers = [];
        
        // 1 እስከ 75 ያሉ መደበኛ የቢንጎ መጥሪያ ቁጥሮች
        const callPool = Array.from({length: 75}, (_, i) => i + 1);
        
        // 200 የቢንጎ ቦርዶች/ካርዶች (Boards #1 እስከ #200)
        const totalBoards = 200;
        const allBoards = Array.from({length: totalBoards}, (_, i) => i + 1);

        const grid = document.getElementById('numberGrid');
        allBoards.forEach(boardNum => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `board-${boardNum}`;
            cell.innerText = `#${boardNum}`;
            grid.appendChild(cell);
        });

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundToggle').innerText = soundOn ? "🔊 ድምፅ: በርቷል" : "🔇 ድምፅ: ጠፍቷል";
        }

        function speakNumber(num) {
            if (!soundOn) return;
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(num.toString());
                utterance.lang = 'am-ET';
                window.speechSynthesis.speak(utterance);
            }
        }

        function startBingo() {
            if (timer) clearInterval(timer);
            calledNumbers = [];
            document.getElementById('status').innerText = "በመጫወት ላይ...";

            // ሁሉንም ቦርዶች ከለር ዳግም ማስጀመር
            allBoards.forEach(b => document.getElementById(`board-${b}`).classList.remove('active'));

            timer = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(timer);
                    document.getElementById('status').innerText = "ጨርሷል!";
                    return;
                }

                let remaining = callPool.filter(n => !calledNumbers.includes(n));
                let randomIndex = Math.floor(Math.random() * remaining.length);
                let currentNum = remaining[randomIndex];

                calledNumbers.push(currentNum);
                document.getElementById('currentNumber').innerText = currentNum;
                
                // በዘፈቀደ የተወሰኑ ቦርዶች (ማሸነፊያ ካርዶች) እንዲበሩ ማድረግ (ለምሳሌ በተጠራው ቁጥር ልክ)
                let activeBoardId = (currentNum % totalBoards) + 1;
                document.getElementById(`board-${activeBoardId}`).classList.add('active');

                speakNumber(currentNum);

            }, 3000);
        }
    </script>
</body>
</html>
