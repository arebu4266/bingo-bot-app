<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 11px;
            align-items: center;
        }
        .top-bar div div:last-child { font-weight: bold; color: #facc15; }

        .game-container {
            display: flex;
            gap: 10px;
            height: calc(100vh - 80px);
        }

        .left-board {
            flex: 1.2;
            background: #1e293b;
            border-radius: 10px;
            padding: 8px;
            overflow-y: auto;
            max-height: 85vh;
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .board-cell {
            background: #334155;
            padding: 8px 2px;
            font-size: 11px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .board-cell.called {
            background: #10b981;
            color: white;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .selection-grid-container {
            background: #1e293b;
            border-radius: 10px;
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 55vh;
        }
        .sel-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
        .sel-cell {
            background: #334155;
            padding: 8px 1px;
            font-size: 11px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }
        .sel-cell.active {
            background: #10b981;
            color: white;
        }

        .cartel-preview {
            background: #1e293b;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }
        
        /* B-I-N-G-O Table Styling */
        .bingo-table {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin-top: 5px;
        }
        .bingo-header {
            background: #0284c7;
            color: white;
            font-size: 11px;
            padding: 4px 0;
            font-weight: bold;
            border-radius: 3px;
        }
        .bingo-cell {
            background: #334155;
            padding: 6px 2px;
            font-size: 10px;
            border-radius: 3px;
            font-weight: bold;
            min-height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bingo-cell.marked {
            background: #10b981;
            color: white;
        }
        .bingo-cell.free {
            background: #f59e0b;
            color: #000;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .timer-box {
            background: #f59e0b;
            color: #000;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="topHeader">
        <div><div>GAME ID</div><div>DBE400</div></div>
        <div><div>PLAYERS</div><div id="playerCount">412</div></div>
        <div><div>BET</div><div>10 ETB</div></div>
        <div><div>DERASH</div><div id="derashPool">3296</div></div>
        <div class="timer-box" id="timerDisplay">40 s</div>
    </div>

    <div id="selectionView">
        <div style="font-size: 12px; margin-bottom: 5px; color: #38bdf8;">ካርቴላ ይምረጡ (ከ 1 እስከ 400 - እስከ 3 ካርቴላ)</div>
        <div class="selection-grid-container">
            <div class="sel-grid" id="selectionGrid"></div>
        </div>
        
        <div class="cartel-preview" style="margin-top: 8px;">
            <div id="cartelTitle" style="font-size: 11px; color: #94a3b8;">ካርቴላ # - (B-I-N-G-O)</div>
            <div class="bingo-table" id="previewTable"></div>
        </div>

        <button class="btn" style="margin-top: 8px;" onclick="confirmCards()">ካርቴላ 🔒 🔒 🔒 (10 ብር)</button>
    </div>

    <div id="gameView" class="game-container" style="display: none;">
        <div class="left-board">
            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: #38bdf8;">
                <span>የተጠራው ቁጥር: <b id="currentCalledNum" style="color: #facc15; font-size: 16px;">-</b></span>
                <span id="calledCount">Called: 0</span>
            </div>
            <div class="board-grid" id="mainBoardGrid"></div>
        </div>

        <div class="right-panel">
            <div style="background: #1e293b; padding: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                <span>AUTOMATIC</span>
                <input type="checkbox" id="autoToggle" checked style="transform: scale(1.2);">
            </div>

            <div class="cartel-preview" style="flex-grow: 1;">
                <div id="activeCartelTitle" style="font-size: 12px; color: #facc15; font-weight: bold;">CARTEL #</div>
                <div class="bingo-table" id="activeCartelTable" style="margin-top: 5px;"></div>
            </div>

            <button class="btn" style="background: #10b981;" onclick="checkBingo()">🎉 BINGO! (አሸነፍኩ)</button>
            <div id="spectatorNotice" style="font-size: 11px; color: #f59e0b; text-align: center;"></div>
        </div>
    </div>

    <script>
        let timeLeft = 40;
        let gameStarted = false;
        let selectedCartels = [];
        let playWallet = 30; // የሙከራ ባላንስ
        let calledNumbers = [];
        const totalCards = 400; // 400 ካርቴላዎች

        // Populate 400 Selection Grid
        const selGrid = document.getElementById('selectionGrid');
        for (let i = 1; i <= totalCards; i++) {
            let cell = document.createElement('div');
            cell.className = 'sel-cell';
            cell.id = `sel-${i}`;
            cell.innerText = i;
            cell.onclick = () => selectCard(i);
            selGrid.appendChild(cell);
        }

        function generateBingoCard(seed) {
            let card = {
                B: [], I: [], N: [], G: [], O: []
            };
            let rand = (min, max) => Math.floor(Math.abs(Math.sin(seed++) * 10000)) % (max - min + 1) + min;

            let getUniqueCols = (min, max, count) => {
                let nums = [];
                while(nums.length < count) {
                    let n = rand(min, max);
                    if(!nums.includes(n)) nums.push(n);
                }
                return nums;
            };

            card.B = getUniqueCols(1, 15, 5);
            card.I = getUniqueCols(16, 30, 5);
            card.N = getUniqueCols(31, 45, 4); // 4 nums + Free
            card.N.splice(2, 0, 'FREE');
            card.G = getUniqueCols(46, 60, 5);
            card.O = getUniqueCols(61, 75, 5);

            return card;
        }

        function selectCard(num) {
            if (gameStarted) return;
            let idx = selectedCartels.indexOf(num);
            if (idx > -1) {
                selectedCartels.splice(idx, 1);
                document.getElementById(`sel-${num}`).classList.remove('active');
            } else {
                if (selectedCartels.length >= 3) {
                    alert('በአንድ ጨዋታ እስከ 3 ካርቴላ ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedCartels.push(num);
                document.getElementById(`sel-${num}`).classList.add('active');
            }
            updatePreview(num);
        }

        function updatePreview(num) {
            document.getElementById('cartelTitle').innerText = `ካርቴላ #${num} (B-I-N-G-O)`;
            let previewTable = document.getElementById('previewTable');
            previewTable.innerHTML = '';

            // Headers B I N G O
            ['B','I','N','G','O'].forEach(h => {
                let th = document.createElement('div');
                th.className = 'bingo-header';
                th.innerText = h;
                previewTable.appendChild(th);
            });

            let cardData = generateBingoCard(num);
            for (let row = 0; row < 5; row++) {
                ['B','I','N','G','O'].forEach(col => {
                    let cCell = document.createElement('div');
                    let val = cardData[col][row];
                    cCell.className = val === 'FREE' ? 'bingo-cell free' : 'bingo-cell';
                    cCell.innerText = val;
                    previewTable.appendChild(cCell);
                });
            }
        }

        let timer = setInterval(() => {
            if (!gameStarted) {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = timeLeft + " s";
                if (timeLeft <= 0) {
                    startGame();
                }
            }
        }, 1000);

        function confirmCards() {
            if (selectedCartels.length === 0) {
                alert('እባክዎን ቢያንስ 1 ካርቴላ ይምረጡ!');
                return;
            }
            let totalCost = selectedCartels.length * 10;
            if (playWallet < totalCost) {
                alert(`❌ በቂ ባላንስ የለዎትም (Insufficient Balance)!\nያስፈለገው: ${totalCost} ብር\nያሎት: ${playWallet} ብር`);
                return;
            }
            playWallet -= totalCost;
            startGame();
        }

        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            clearInterval(timer);

            document.getElementById('selectionView').style.display = 'none';
            document.getElementById('gameView').style.display = 'flex';
            document.getElementById('timerDisplay').innerText = "InProgress";

            if (selectedCartels.length === 0) {
                document.getElementById('spectatorNotice').innerText = "👀 (እንደ ተመልካች ብቻ ተሳትፈዋል)";
                selectedCartels = [1]; 
            }

            // Main Board 1 to 75
            let mainBoard = document.getElementById('mainBoardGrid');
            for (let i = 1; i <= 75; i++) {
                let bCell = document.createElement('div');
                bCell.className = 'board-cell';
                bCell.id = `b-cell-${i}`;
                bCell.innerText = i;
                mainBoard.appendChild(bCell);
            }

            // Active Cartel Table
            let activeTable = document.getElementById('activeCartelTable');
            document.getElementById('activeCartelTitle').innerText = `CARTEL #${selectedCartels[0]}`;
            
            ['B','I','N','G','O'].forEach(h => {
                let th = document.createElement('div');
                th.className = 'bingo-header';
                th.innerText = h;
                activeTable.appendChild(th);
            });

            let activeCard = generateBingoCard(selectedCartels[0]);
            for (let row = 0; row < 5; row++) {
                ['B','I','N','G','O'].forEach(col => {
                    let val = activeCard[col][row];
                    let acCell = document.createElement('div');
                    acCell.className = val === 'FREE' ? 'bingo-cell free marked' : 'bingo-cell';
                    if(val !== 'FREE') acCell.id = `active-num-${val}`;
                    acCell.innerText = val;
                    activeTable.appendChild(acCell);
                });
            }

            // Game Loop
            let allNums = Array.from({length: 75}, (_, i) => i + 1);
            let gameLoop = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(gameLoop);
                    return;
                }
                let remaining = allNums.filter(n => !calledNumbers.includes(n));
                let drawn = remaining[Math.floor(Math.random() * remaining.length)];
                calledNumbers.push(drawn);

                document.getElementById('currentCalledNum').innerText = drawn;
                document.getElementById('calledCount').innerText = `Called: ${calledNumbers.length}`;

                if (document.getElementById(`b-cell-${drawn}`)) {
                    document.getElementById(`b-cell-${drawn}`).classList.add('called');
                }
                if (document.getElementById(`active-num-${drawn}`)) {
                    document.getElementById(`active-num-${drawn}`).classList.add('marked');
                }
            }, 3000);
        }

        function checkBingo() {
            alert('🎉 BINGO የተረጋገጠ ጥያቄዎ ለአስተዳዳሪው ተልኳል!');
        }
    </script>
</body>
</html>
