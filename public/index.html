<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dil Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 11px;
            align-items: center;
        }
        .top-bar div div:last-child { font-weight: bold; color: #facc15; }

        .game-container {
            display: flex;
            gap: 8px;
            height: calc(100vh - 75px);
        }

        /* Left Vertical B-I-N-G-O Board */
        .left-board {
            flex: 1.4;
            background: #1e293b;
            border-radius: 8px;
            padding: 6px;
            overflow-y: auto;
            max-height: 85vh;
        }
        .bingo-board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            text-align: center;
        }
        .bingo-col-header {
            background: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 4px 0;
            border-radius: 3px;
        }
        .board-num-cell {
            background: #334155;
            font-size: 11px;
            padding: 7px 1px;
            text-align: center;
            border-radius: 3px;
            font-weight: bold;
        }
        .board-num-cell.called {
            background: #10b981;
            color: white;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 85vh;
        }

        .selection-grid-container {
            background: #1e293b;
            border-radius: 8px;
            padding: 8px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 48vh;
        }
        .sel-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
